name: itea_app
description: Application ITEA - Gestion de missions

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  flutter_screenutil: ^5.9.0
  file_picker: ^8.0.0
  http: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  share_plus: ^7.2.1
  open_file: ^3.2.1
  youtube_player_flutter: ^9.0.0
  intl: ^0.20.2
  pdf: ^3.11.0
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: any
  syncfusion_flutter_core: any
  flutter_pdfview: ^1.4.4
  photo_view: any
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  permission_handler: ^11.3.1
  record: ^5.2.0
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.0
  connectivity_plus: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
