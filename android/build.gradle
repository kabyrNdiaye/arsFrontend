allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// rootProject.buildDir = "../../build"
// subprojects {
//     project.buildDir = "${rootProject.buildDir}/${project.name}"
// }
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdkVersion 34
            defaultConfig {
                targetSdkVersion 34
            }
            if (namespace == null) {
                def grp = project.group.toString()
                namespace = (grp != null && !grp.isEmpty()) ? grp : "com.itea.${project.name.replace("-", ".")}"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
